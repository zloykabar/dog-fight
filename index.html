<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Собачьи бои</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            user-select: none;
        }
        body {
            background: linear-gradient(145deg, #1e2a1e 0%, #2a3a2a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 16px;
        }
        .game {
            max-width: 1000px;
            width: 100%;
            background: #2d2418;
            border-radius: 48px 48px 24px 24px;
            box-shadow: 0 20px 30px rgba(0,0,0,0.7), inset 0 0 0 2px #ac9e8b;
            padding: 24px;
            border: 4px solid #7e6e5a;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #4b3a28;
            padding: 12px 24px;
            border-radius: 100px;
            margin-bottom: 24px;
            color: #ffd966;
            text-shadow: 2px 2px 0 #1a1a1a;
            border: 2px solid #baa88c;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.5);
        }
        .coins {
            font-size: 28px;
            font-weight: bold;
            background: #1e1e1e;
            padding: 8px 24px;
            border-radius: 40px;
            border: 2px solid #d4af37;
            letter-spacing: 1px;
            box-shadow: 0 0 12px #ffb347;
        }
        .coins span {
            color: #ffd966;
            margin-right: 8px;
        }
        .panel {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .left, .right {
            flex: 1 1 280px;
            background: #3a2e22;
            border-radius: 32px;
            padding: 20px;
            border: 3px solid #6b5a48;
            box-shadow: inset 0 0 10px #1e1812;
        }
        .left h2, .right h2 {
            margin-top: 0;
            color: #f5e6c4;
            text-align: center;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 2px dashed #b39b7a;
            padding-bottom: 8px;
        }
        .dog-card {
            background: #5e4b36;
            border-radius: 24px;
            padding: 14px;
            margin-bottom: 16px;
            border: 2px solid #b39b7a;
            box-shadow: 0 6px 0 #2e241b;
            transition: 0.1s;
            color: #f0e0c0;
        }
        .dog-card.selected {
            border: 4px solid #f9d56e;
            background: #6b5540;
            box-shadow: 0 0 20px #f9d56e;
        }
        .dog-name {
            font-size: 24px;
            font-weight: 800;
            display: flex;
            justify-content: space-between;
            color: #f9d56e;
        }
        .dog-breed {
            font-size: 16px;
            color: #c7b29a;
            margin-bottom: 10px;
            font-style: italic;
        }
        .stats {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 16px;
            margin: 12px 0;
            font-weight: 600;
            font-size: 15px;
        }
        .stat-item {
            background: #2b221b;
            padding: 6px 12px;
            border-radius: 30px;
            border: 1px solid #d4af37;
        }
        .stat-value {
            color: #ffd966;
            margin-left: 6px;
        }
        .xp-bar {
            width: 100%;
            height: 12px;
            background: #1f1a14;
            border-radius: 20px;
            margin: 10px 0;
            overflow: hidden;
            border: 1px solid #b89b70;
        }
        .xp-fill {
            height: 100%;
            background: linear-gradient(90deg, #d4af37, #ffb347);
            width: 0%;
            transition: width 0.3s;
        }
        .btn {
            background: #d4af37;
            border: none;
            border-radius: 40px;
            padding: 10px 20px;
            font-weight: 800;
            font-size: 16px;
            color: #1e1e1e;
            cursor: pointer;
            box-shadow: 0 5px 0 #7e5e2a, 0 6px 12px black;
            transition: 0.05s linear;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin: 4px 4px 4px 0;
            border: 1px solid #fff3cf;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #7e5e2a;
        }
        .btn:disabled {
            opacity: 0.4;
            transform: translateY(4px);
            box-shadow: 0 1px 0 #7e5e2a;
            cursor: not-allowed;
            filter: grayscale(0.5);
        }
        .btn-small {
            padding: 6px 14px;
            font-size: 14px;
        }
        .shop-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 12px;
        }
        .shop-item {
            background: #4b3a28;
            border-radius: 20px;
            padding: 12px;
            border: 2px solid #8e7a64;
            color: #f0e0c0;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .shop-item .item-name {
            font-weight: 800;
            color: #ffd966;
            font-size: 16px;
        }
        .shop-item .item-desc {
            font-size: 12px;
            color: #cbb99e;
            margin: 6px 0;
        }
        .shop-item .price {
            font-weight: 700;
            color: #ffb347;
            margin: 6px 0;
            font-size: 18px;
        }
        .equipment-badge {
            background: #2b221b;
            border-radius: 30px;
            padding: 6px 12px;
            font-size: 14px;
            display: inline-block;
            margin: 2px 4px 2px 0;
            border: 1px solid #d4af37;
            color: #ffd966;
        }
        .log {
            background: #1e1812;
            border-radius: 20px;
            padding: 12px;
            margin-top: 16px;
            height: 120px;
            overflow-y: auto;
            font-size: 14px;
            border: 2px solid #8e7a64;
            color: #cfc2a8;
            font-family: 'Courier New', monospace;
        }
        .log p {
            margin: 4px 0;
            border-bottom: 1px solid #3a2e22;
            padding-bottom: 2px;
        }
        .health-bar {
            width: 100%;
            height: 14px;
            background: #1f1a14;
            border-radius: 20px;
            margin-top: 6px;
            border: 1px solid #b89b70;
            overflow: hidden;
        }
        .health-fill {
            height: 100%;
            background: linear-gradient(90deg, #c0392b, #e74c3c);
            width: 100%;
            transition: width 0.2s;
        }
        .flex-row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .dog-avatar {
            font-size: 32px;
            filter: drop-shadow(2px 4px 4px black);
        }
        .selected-label {
            color: #f9d56e;
            font-weight: bold;
            background: #2a1e12;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            border: 1px solid #d4af37;
        }
    </style>
</head>
<body>
<div class="game" id="app">
    <!-- Заголовок -->
    <div class="header">
        <div class="coins"><span>💰</span><span id="coinsDisplay">500</span></div>
        <div style="font-size: 22px; font-weight: bold; color: #ffd966;">🐕 СОБАЧЬИ БОИ 🐕</div>
        <div style="font-size: 18px; background: #1e1e1e; padding: 6px 16px; border-radius: 30px; border: 1px solid #d4af37;">⚔️ АРЕНА ⚔️</div>
    </div>

    <!-- Основная панель -->
    <div class="panel">
        <!-- Левая колонка: собаки -->
        <div class="left">
            <h2>🐾 ВАШИ СОБАКИ</h2>
            <div id="dogsList"></div>
            <div style="margin-top: 12px;">
                <button class="btn" id="fightBtn">⚔️ НАЧАТЬ БОЙ</button>
                <button class="btn btn-small" id="healAllBtn">💊 ЛЕЧИТЬ ВСЕХ (50💰)</button>
            </div>
        </div>

        <!-- Правая колонка: магазин и улучшения -->
        <div class="right">
            <h2>🛒 МАГАЗИН</h2>
            <div id="shopContainer"></div>

            <h2 style="margin-top: 24px;">⬆️ ПРОКАЧКА (выбранная собака)</h2>
            <div id="upgradePanel"></div>

            <div class="log" id="logContainer">
                <p>Добро пожаловать на собачьи бои!</p>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        // ---------- ДАННЫЕ ----------
        const BREEDS = [
            { breed: 'Бультерьер', baseHp: 90, baseAtk: 14, baseDef: 6, icon: '🐕‍🦺' },
            { breed: 'Овчарка', baseHp: 100, baseAtk: 12, baseDef: 9, icon: '🐕' },
            { breed: 'Питбуль', baseHp: 110, baseAtk: 16, baseDef: 5, icon: '🐶' },
            { breed: 'Доберман', baseHp: 80, baseAtk: 18, baseDef: 7, icon: '🐕‍🦺' },
            { breed: 'Ротвейлер', baseHp: 120, baseAtk: 13, baseDef: 10, icon: '🐶' }
        ];

        const SHOP_ITEMS = [
            { id: 'collar', name: 'Ошейник', desc: '+5 к защите', price: 150, type: 'equip', stat: 'def', value: 5 },
            { id: 'spikes', name: 'Шипастый ошейник', desc: '+10 к атаке', price: 300, type: 'equip', stat: 'atk', value: 10 },
            { id: 'armor', name: 'Броня', desc: '+15 к защите', price: 400, type: 'equip', stat: 'def', value: 15 },
            { id: 'steroids', name: 'Стероиды', desc: '+8 к атаке', price: 250, type: 'equip', stat: 'atk', value: 8 }
        ];

        // ---------- СОСТОЯНИЕ ----------
        let state = {
            coins: 500,
            dogs: [],
            selectedDogId: null,
            equipmentInventory: [] // id купленной экипировки (можно улучшать)
        };

        // Вспомогательные функции
        function getSelectedDog() {
            return state.dogs.find(d => d.id === state.selectedDogId) || null;
        }

        function logMessage(msg) {
            const logEl = document.getElementById('logContainer');
            const p = document.createElement('p');
            p.textContent = msg;
            logEl.appendChild(p);
            logEl.scrollTop = logEl.scrollHeight;
            if (logEl.children.length > 30) logEl.removeChild(logEl.children[0]);
        }

        // Создание собаки с породой
        function createDog(breedData, name = null) {
            const id = Date.now() + Math.random() * 10000;
            const baseHp = breedData.baseHp + Math.floor(Math.random() * 15);
            const baseAtk = breedData.baseAtk + Math.floor(Math.random() * 5);
            const baseDef = breedData.baseDef + Math.floor(Math.random() * 4);
            return {
                id: id,
                name: name || breedData.breed + ' ' + (state.dogs.length + 1),
                breed: breedData.breed,
                icon: breedData.icon,
                level: 1,
                xp: 0,
                xpToNext: 100,
                maxHp: baseHp,
                currentHp: baseHp,
                baseAtk: baseAtk,
                baseDef: baseDef,
                // экипировка: массив id предметов (может быть несколько, но эффекты суммируются)
                equipment: []
            };
        }

        // Добавляем стартовых собак
        function initDogs() {
            if (state.dogs.length > 0) return;
            for (let i = 0; i < 3; i++) {
                const breed = BREEDS[Math.floor(Math.random() * BREEDS.length)];
                state.dogs.push(createDog(breed));
            }
            state.selectedDogId = state.dogs[0]?.id;
        }

        // Пересчет характеристик с учетом экипировки
        function getDogStats(dog) {
            if (!dog) return { atk: 0, def: 0, maxHp: 0 };
            let bonusAtk = 0;
            let bonusDef = 0;
            // Считаем экипировку (по id предметов)
            dog.equipment.forEach(eqId => {
                const item = SHOP_ITEMS.find(i => i.id === eqId);
                if (item) {
                    if (item.stat === 'atk') bonusAtk += item.value;
                    if (item.stat === 'def') bonusDef += item.value;
                }
            });
            // Уровень влияет на статы
            const levelBonus = dog.level - 1;
            const atk = dog.baseAtk + bonusAtk + levelBonus * 2;
            const def = dog.baseDef + bonusDef + levelBonus * 1;
            const maxHp = dog.maxHp + levelBonus * 10;
            return { atk, def, maxHp, bonusAtk, bonusDef };
        }

        // Обновить текущее HP при изменении maxHP (левел-ап)
        function syncDogHp(dog) {
            const stats = getDogStats(dog);
            if (dog.currentHp > stats.maxHp) dog.currentHp = stats.maxHp;
            if (dog.currentHp <= 0) dog.currentHp = 1; // не даем умереть полностью
            dog.maxHp = stats.maxHp; // сохраняем обновленный maxHp
        }

        // ---------- ОТРИСОВКА ----------
        function render() {
            renderCoins();
            renderDogs();
            renderShop();
            renderUpgradePanel();
        }

        function renderCoins() {
            document.getElementById('coinsDisplay').textContent = state.coins;
        }

        function renderDogs() {
            const container = document.getElementById('dogsList');
            container.innerHTML = '';
            state.dogs.forEach(dog => {
                const stats = getDogStats(dog);
                const isSelected = dog.id === state.selectedDogId;

                const card = document.createElement('div');
                card.className = `dog-card ${isSelected ? 'selected' : ''}`;
                card.dataset.id = dog.id;
                card.innerHTML = `
                    <div class="dog-name">
                        <span>${dog.icon} ${dog.name}</span>
                        <span style="font-size:16px; color:#ffb347;">Ур.${dog.level}</span>
                    </div>
                    <div class="dog-breed">${dog.breed}</div>
                    <div class="stats">
                        <div class="stat-item">❤️ HP <span class="stat-value">${dog.currentHp}/${stats.maxHp}</span></div>
                        <div class="stat-item">⚔️ Атака <span class="stat-value">${stats.atk}</span></div>
                        <div class="stat-item">🛡️ Защита <span class="stat-value">${stats.def}</span></div>
                    </div>
                    <div class="xp-bar"><div class="xp-fill" style="width: ${(dog.xp / dog.xpToNext) * 100}%"></div></div>
                    <div style="display: flex; justify-content: space-between; font-size: 14px; margin-top: 4px;">
                        <span>XP: ${dog.xp}/${dog.xpToNext}</span>
                        <span>${dog.equipment.length > 0 ? '🛡️ Экипировка' : '—'}</span>
                    </div>
                    <div class="health-bar"><div class="health-fill" style="width: ${(dog.currentHp / stats.maxHp) * 100}%"></div></div>
                `;

                card.addEventListener('click', () => {
                    state.selectedDogId = dog.id;
                    render();
                });

                container.appendChild(card);
            });
        }

        function renderShop() {
            const container = document.getElementById('shopContainer');
            container.innerHTML = '<div class="shop-grid" id="shopGrid"></div>';
            const grid = document.getElementById('shopGrid');
            SHOP_ITEMS.forEach(item => {
                const div = document.createElement('div');
                div.className = 'shop-item';
                div.innerHTML = `
                    <div class="item-name">${item.name}</div>
                    <div class="item-desc">${item.desc}</div>
                    <div class="price">${item.price}💰</div>
                    <button class="btn btn-small buy-btn" data-id="${item.id}">Купить</button>
                `;
                grid.appendChild(div);
            });
            // Навешиваем обработчики
            container.querySelectorAll('.buy-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const itemId = btn.dataset.id;
                    const item = SHOP_ITEMS.find(i => i.id === itemId);
                    if (state.coins < item.price) {
                        logMessage(`Недостаточно монет для покупки ${item.name}`);
                        return;
                    }
                    const selectedDog = getSelectedDog();
                    if (!selectedDog) {
                        logMessage('Сначала выберите собаку!');
                        return;
                    }
                    state.coins -= item.price;
                    // Добавляем экипировку выбранной собаке
                    selectedDog.equipment.push(item.id);
                    // Пересчитываем здоровье, если нужно
                    const newStats = getDogStats(selectedDog);
                    if (selectedDog.currentHp > newStats.maxHp) selectedDog.currentHp = newStats.maxHp;
                    selectedDog.maxHp = newStats.maxHp;
                    logMessage(`${selectedDog.name} получает ${item.name}!`);
                    render();
                });
            });
        }

        function renderUpgradePanel() {
            const container = document.getElementById('upgradePanel');
            const dog = getSelectedDog();
            if (!dog) {
                container.innerHTML = '<p style="color:#b39b7a;">Выберите собаку</p>';
                return;
            }
            const stats = getDogStats(dog);
            const upgradeCost = 100 + dog.level * 50;
            const canUpgrade = state.coins >= upgradeCost && dog.level < 20;

            // Экипировка собаки (список)
            let equipHtml = '';
            if (dog.equipment.length > 0) {
                dog.equipment.forEach(eqId => {
                    const item = SHOP_ITEMS.find(i => i.id === eqId);
                    if (item) equipHtml += `<span class="equipment-badge">${item.name}</span>`;
                });
            } else {
                equipHtml = '<span style="color:#b39b7a;">Нет экипировки</span>';
            }

            container.innerHTML = `
                <div style="background:#4b3a28; border-radius:20px; padding:12px; border:1px solid #8e7a64;">
                    <div style="font-size:18px; font-weight:bold; color:#ffd966; margin-bottom:8px;">
                        ${dog.icon} ${dog.name} (Ур.${dog.level})
                    </div>
                    <div>${equipHtml}</div>
                    <div style="margin: 12px 0;">
                        <button class="btn btn-small" id="upgradeBtn" ${!canUpgrade ? 'disabled' : ''}>⬆️ Улучшить (${upgradeCost}💰)</button>
                        <button class="btn btn-small" id="healOneBtn">💊 Лечить (30💰)</button>
                    </div>
                </div>
            `;

            const upgradeBtn = document.getElementById('upgradeBtn');
            if (upgradeBtn) {
                upgradeBtn.addEventListener('click', () => {
                    const dog = getSelectedDog();
                    if (!dog) return;
                    const cost = 100 + dog.level * 50;
                    if (state.coins < cost) {
                        logMessage('Не хватает монет для улучшения');
                        return;
                    }
                    if (dog.level >= 20) {
                        logMessage('Максимальный уровень!');
                        return;
                    }
                    state.coins -= cost;
                    dog.level += 1;
                    dog.xp = 0;
                    dog.xpToNext = Math.floor(dog.xpToNext * 1.4);
                    // Обновляем здоровье
                    const newStats = getDogStats(dog);
                    dog.maxHp = newStats.maxHp;
                    dog.currentHp = newStats.maxHp; // лечим при повышении уровня
                    logMessage(`${dog.name} повышает уровень до ${dog.level}!`);
                    render();
                });
            }

            const healOneBtn = document.getElementById('healOneBtn');
            if (healOneBtn) {
                healOneBtn.addEventListener('click', () => {
                    const dog = getSelectedDog();
                    if (!dog) return;
                    const stats = getDogStats(dog);
                    if (dog.currentHp >= stats.maxHp) {
                        logMessage('Собака уже здорова');
                        return;
                    }
                    if (state.coins < 30) {
                        logMessage('Недостаточно монет для лечения');
                        return;
                    }
                    state.coins -= 30;
                    dog.currentHp = Math.min(stats.maxHp, dog.currentHp + 40);
                    logMessage(`${dog.name} восстановил 40 HP`);
                    render();
                });
            }
        }

        // ---------- БОЙ ----------
        function startFight() {
            const playerDog = getSelectedDog();
            if (!playerDog) {
                logMessage('Выберите свою собаку!');
                return;
            }
            if (playerDog.currentHp <= 0) {
                logMessage('Собака слишком слаба для боя! Подлечите её.');
                return;
            }

            // Генерируем случайного противника
            const enemyBreed = BREEDS[Math.floor(Math.random() * BREEDS.length)];
            const enemy = createDog(enemyBreed, 'Враг ' + enemyBreed.breed);
            // Противник немного сильнее в зависимости от уровня игрока
            const baseLevel = Math.max(1, playerDog.level + Math.floor(Math.random() * 3) - 1);
            enemy.level = baseLevel;
            const enemyStats = getDogStats(enemy);
            enemy.maxHp = enemyStats.maxHp;
            enemy.currentHp = enemyStats.maxHp;

            logMessage(`⚔️ Бой: ${playerDog.name} (Ур.${playerDog.level}) VS ${enemy.name} (Ур.${enemy.level})`);

            // Простая симуляция боя
            const playerStats = getDogStats(playerDog);
            let playerHp = playerDog.currentHp;
            let enemyHp = enemy.currentHp;
            const playerAtk = playerStats.atk;
            const enemyAtk = enemyStats.atk;
            const playerDef = playerStats.def;
            const enemyDef = enemyStats.def;

            let turn = 0;
            let battleLog = [];

            while (playerHp > 0 && enemyHp > 0 && turn < 30) {
                turn++;
                // Игрок атакует
                const playerDamage = Math.max(1, playerAtk - Math.floor(enemyDef * 0.6) + Math.floor(Math.random() * 5));
                enemyHp -= playerDamage;
                battleLog.push(`🐕 ${playerDog.name} наносит ${playerDamage} урона`);

                if (enemyHp <= 0) break;

                // Враг атакует
                const enemyDamage = Math.max(1, enemyAtk - Math.floor(playerDef * 0.6) + Math.floor(Math.random() * 5));
                playerHp -= enemyDamage;
                battleLog.push(`🐶 ${enemy.name} наносит ${enemyDamage} урона`);
            }

            // Итог
            let winner = null;
            if (playerHp <= 0 && enemyHp <= 0) {
                winner = 'draw';
            } else if (playerHp <= 0) {
                winner = 'enemy';
            } else if (enemyHp <= 0) {
                winner = 'player';
            } else {
                // по истечении ходов сравниваем здоровье
                winner = playerHp > enemyHp ? 'player' : 'enemy';
            }

            // Обновляем HP игрока
            playerDog.currentHp = Math.max(1, playerHp);

            // Награды и опыт
            if (winner === 'player') {
                const coinsReward = 50 + enemy.level * 20;
                const xpReward = 40 + enemy.level * 15;
                state.coins += coinsReward;
                playerDog.xp += xpReward;
                logMessage(`🏆 Победа! +${coinsReward}💰, +${xpReward} XP`);
                // Проверка на уровень
                while (playerDog.xp >= playerDog.xpToNext && playerDog.level < 20) {
                    playerDog.level++;
                    playerDog.xp -= playerDog.xpToNext;
                    playerDog.xpToNext = Math.floor(playerDog.xpToNext * 1.4);
                    const newStats = getDogStats(playerDog);
                    playerDog.maxHp = newStats.maxHp;
                    playerDog.currentHp = newStats.maxHp;
                    logMessage(`🎉 ${playerDog.name} достигает уровня ${playerDog.level}!`);
                }
            } else if (winner === 'enemy') {
                logMessage(`💔 Поражение... ${playerDog.name} получает 10 XP за старание`);
                playerDog.xp += 10;
                if (playerDog.xp >= playerDog.xpToNext && playerDog.level < 20) {
                    playerDog.level++;
                    playerDog.xp -= playerDog.xpToNext;
                    playerDog.xpToNext = Math.floor(playerDog.xpToNext * 1.4);
                    const newStats = getDogStats(playerDog);
                    playerDog.maxHp = newStats.maxHp;
                    playerDog.currentHp = newStats.maxHp;
                    logMessage(`⬆️ ${playerDog.name} достигает уровня ${playerDog.level}!`);
                }
            } else {
                logMessage(`🤝 Ничья. Оба получают по 20 XP`);
                playerDog.xp += 20;
                if (playerDog.xp >= playerDog.xpToNext && playerDog.level < 20) {
                    playerDog.level++;
                    playerDog.xp -= playerDog.xpToNext;
                    playerDog.xpToNext = Math.floor(playerDog.xpToNext * 1.4);
                    const newStats = getDogStats(playerDog);
                    playerDog.maxHp = newStats.maxHp;
                    playerDog.currentHp = newStats.maxHp;
                }
            }

            // Обновляем максимальное HP собаки
            const finalStats = getDogStats(playerDog);
            playerDog.maxHp = finalStats.maxHp;
            if (playerDog.currentHp > finalStats.maxHp) playerDog.currentHp = finalStats.maxHp;

            // Выводим лог боя
            battleLog.slice(0, 6).forEach(l => logMessage(l));
            if (battleLog.length > 6) logMessage('...');
            render();
        }

        // Лечение всех собак
        function healAll() {
            if (state.coins < 50) {
                logMessage('Не хватает монет для лечения всех (нужно 50)');
                return;
            }
            let healedAny = false;
            state.dogs.forEach(dog => {
                const stats = getDogStats(dog);
                if (dog.currentHp < stats.maxHp) {
                    dog.currentHp = stats.maxHp;
                    healedAny = true;
                }
            });
            if (healedAny) {
                state.coins -= 50;
                logMessage('Все собаки полностью вылечены!');
            } else {
                logMessage('Все собаки уже здоровы');
            }
            render();
        }

        // ---------- ИНИЦИАЛИЗАЦИЯ ----------
        function init() {
            initDogs();
            render();

            // Обработчики кнопок
            document.getElementById('fightBtn').addEventListener('click', startFight);
            document.getElementById('healAllBtn').addEventListener('click', healAll);

            // Автоматическое обновление HP при смене выбора не требуется
        }

        // Запуск
        window.addEventListener('DOMContentLoaded', init);
    })();
</script>
</body>
</html>
